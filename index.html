<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINV — The inventory that stops burning money · BNM Parapharm</title>
<style>
:root{--bg:#0b1210;--bd:#2b3c36;--tx:#e8f1ec;--mu:#a4b8ae;--pr:#3dd68c;--go:#e5b94e;--rd:#f87171;--or:#fb923c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#logo{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:16px;z-index:5;background:#fff;border-radius:12px;padding:4px 8px;height:50px}#logo img{height:100%;display:block}
#pb{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--rd),var(--go),var(--pr));z-index:6;width:0}
#top{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:6;display:flex;gap:8px;align-items:center}#lg{display:flex;border:1px solid var(--bd);border-radius:99px;overflow:hidden;background:#0008;backdrop-filter:blur(8px)}#lg button{all:unset;cursor:pointer;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--mu)}#lg button.on{background:var(--pr);color:#04210f}#tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:#0008;backdrop-filter:blur(8px);color:var(--or);transition:.6s}
#tag.ok{color:var(--pr)}
main{position:relative;z-index:2}
.ch{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:90px clamp(16px,6vw,90px) 60px}.ch.R{justify-content:flex-end}
.cd{width:min(450px,100%);background:rgba(11,18,16,.76);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:20px;padding:24px;opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}.cd.in{opacity:1;transform:none}.cd.w{width:min(720px,100%)}
.k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--pr);margin-bottom:8px}.pn .k{color:var(--or)}
h1{font-size:clamp(34px,5.2vw,64px);line-height:1.03;margin:0 0 12px;letter-spacing:-.02em}h2{font-size:clamp(25px,3vw,38px);line-height:1.1;margin:0 0 10px}
p{color:var(--mu);line-height:1.55;margin:0 0 12px;font-size:clamp(14px,1.2vw,16.5px)}
.g{color:var(--pr)}.r{color:var(--rd)}.o{color:var(--or)}
.live{display:flex;gap:10px}.live div{flex:1;background:#0006;border:1px solid var(--bd);border-radius:12px;padding:10px}.live b{display:block;font-size:26px}.live span{font-size:11px;color:var(--mu)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}.gr div{background:#0006;border:1px solid var(--bd);border-radius:12px;padding:12px}.gr b{display:block;font-size:28px;color:var(--pr)}.gr span{font-size:12px;color:var(--mu)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.calc label{font-size:11px;color:var(--mu)}.calc input{width:100%;margin-top:3px;background:#1a2722;border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:8px;font-size:15px;font-weight:700}
.big{font-size:clamp(24px,3.2vw,42px);font-weight:800;margin:12px 0 4px}.nt{font-size:11px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:600}
.btn{display:inline-block;margin-top:8px;background:var(--pr);color:#04210f;font-weight:800;border-radius:12px;padding:12px 20px;text-decoration:none}
.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--mu);letter-spacing:.2em;text-transform:uppercase;animation:b 1.6s infinite;transition:opacity .5s}
@keyframes b{50%{transform:translate(-50%,6px)}}
@media(max-width:760px){.ch,.ch.R{align-items:flex-end;justify-content:center;padding:80px 10px 60px}.cd,.cd.w{padding:14px;background:rgba(11,18,16,.88);border-radius:16px}h1{font-size:30px}h2{font-size:22px}p{font-size:13px;margin-bottom:8px}.k{font-size:10px}#tag{display:none}#logo{height:38px}.calc{grid-template-columns:1fr 1fr}.calc input{padding:6px;font-size:14px}.gr{grid-template-columns:1fr 1fr}.gr b{font-size:22px}table{font-size:11px}td,th{padding:5px}.pl ul{columns:1;font-size:12.5px;line-height:1.5}.pr{font-size:30px}.ro{grid-template-columns:1fr 1fr 1fr}.ro b{font-size:16px}.ro span{font-size:10px}.live b{font-size:20px}.big{font-size:22px}}</style></head><body>

const CH=[
['Inventory day · BNM Parapharm','Every inventory burns <span class=o>paper</span>, <span class=r>time</span> and <span class=r>money.</span>','Scroll. Follow one inventory the way it runs today, then watch it run on BINV.','L',1],
['01 · Print everything','The printer never stops.','Every product from Compiere is printed. Hundreds of pages, ink draining, for a list that is already out of date.<div class=live><div><b class=o id=pg>0</b><span>pages printed</span></div><div><b class=r id=ink>100%</b><span>ink left</span></div></div>','R',1],
['Paper = money','Every page is a <span class=o>banknote</span> flying away.','Paper, toner, printer wear. Then the sheets are filled by hand, retyped, and forgotten. Cost with zero value added.','L',1],
['02 · Counting on paper','Some walk. Some <span class=o>wait.</span>','Teams wait for their sheets, walk the aisles with clipboards and write numbers by hand. Others stand idle until the previous step is finished.','R',1],
['03 · Hangar → BNM Parapharm','Every trip is <span class=o>time wasted.</span>','The hangar team counts and writes everything on paper, then the whole stack rides to BNM Parapharm before anyone can enter it. Hours on the road for numbers that could arrive in a second.','L',1],
['04 · Saisie','The same numbers, <span class=r>typed twice.</span>','Counting is done, but nobody knows the result until someone retypes every line. The stack goes down slowly. The calendar does not wait.','R',1],
['05 · Écarts &amp; recounts','Conflicts. Recounts. <span class=r>Repeat.</span>','Gaps appear days late. Who counted this? Which lines to recount? The loop restarts, and so do the overtime, the weekends and the exhaustion, while distribution stays stopped.','L',1],
['The bill','Stop distribution <span class=r>13 days</span> or <span class=g>3 to 4?</span>','<b style="color:#e8f1ec">Most important: more days to sell.</b> Every inventory day is a day when deliveries do not leave. Add the overtime and the weekends, and the loss is in the millions. Try your figures:<div class=calc><label>Stock agents<input id=a type=number value=20></label><label>Overtime + weekend cost / agent / day (DZD)<input id=b type=number value=3000></label><label>Days stopped today<input id=d type=number value=13></label><label>Days stopped with BINV<input id=e type=number value=4></label><label>Sales / day (DZD)<input id=s type=number value=10000000></label><label>Inventories / year<input id=f type=number value=1></label></div><div class=big>Potential gain: <span class=g id=o>—</span> / year</div><div class=nt id=o3></div><div class=nt id=o2></div><div class=nt>Illustrative assumptions: replace with BNM’s real figures.</div>','R',1,1],
['Now: BINV','Paper dissolves into <span class=g>live data.</span>','The document comes from Compiere. Teams count on their phones. Every quantity lands instantly. Nothing to print, nothing to retype.','L',0],
